[project]
name = "groundtruth"
version = "0.1.0"
description = "A regression-gated evaluation harness that proves a retrieval change was an improvement, not just asserts it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# ---------------------------------------------------------------------------
# Core dependencies. Deliberately small and CPU-only.
#
# Nothing here pulls torch. This is what lets the regression gate run with no
# model download, no network and no API key -- see [project.optional-dependencies].
# ---------------------------------------------------------------------------
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "numpy>=2.1,<3",
    # Rust tokenizer, no torch dependency. Lets CI rebuild chunks deterministically
    # from the vendored tokenizer with zero network access.
    "tokenizers>=0.20,<0.22",
    "zstandard>=0.23,<0.24",
    "typer>=0.12,<0.16",
    "rich>=13.8,<15",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
# The FastAPI service path. Needed to serve the API, not to run the gate.
api = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.31,<0.36",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "asyncpg>=0.30,<0.31",
    "pgvector>=0.3.6,<0.5",
]

# Local model weights. ~1.25 GB installed (bge-small-en-v1.5 ~133 MB,
# bge-reranker-base ~1.11 GB), so this is opt-in on purpose.
#
# The gate NEVER installs this extra. That makes an accidental model download
# during a gate run structurally impossible rather than merely discouraged.
models = [
    "torch>=2.4,<3",
    "sentence-transformers>=3.1,<5",
]

# The generation-layer judge. Separate from `models` because the judge is an
# API call, not a local weight, and is never part of the gate.
judge = ["anthropic>=0.40,<1"]

dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<8",
    "pytest-asyncio>=0.24,<2",
    "pytest-timeout>=2.3,<3",
    "hypothesis>=6.112,<7",
    "mypy>=1.11,<2",
    # Must stay in the same minor series as the globally installed ruff that
    # ECC's quality-gate hook invokes (it resolves `ruff` from PATH, not from
    # this venv). A mismatch means the hook formats code that
    # `ruff format --check` then rejects -- endless, baffling churn.
    # Keep in sync with: uv tool install ruff==<same minor>
    "ruff>=0.16,<0.17",
]

[project.scripts]
gt = "groundtruth.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth"]

# ---------------------------------------------------------------------------
# CPU-only torch. NON-NEGOTIABLE.
#
# Default resolution on linux/amd64 pulls the CUDA build and ~2.5-3 GB of
# nvidia-* wheels. That is the difference between a ~2.5 GB and a ~6 GB image,
# and between a 90-second and a 6-minute dependency install. This project never
# uses a GPU -- the corpus is ~13k chunks and exact search takes milliseconds.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ---------------------------------------------------------------------------
# Tool configuration lives HERE, never in ruff.toml/mypy.ini/pytest.ini.
#
# Two reasons. It keeps configuration in one reviewable place, and ECC's
# config-protection hook blocks edits to ruff.toml/.ruff.toml (so the agent
# fixes code instead of weakening the linter) while deliberately exempting
# pyproject.toml. Creating a ruff.toml would make this file uneditable.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting (replaces isort)
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "ANN",           # require type annotations
    "C90",           # mccabe complexity
    "RUF",
]
ignore = [
    "ANN101", "ANN102",  # self/cls annotations are noise
    "E501",              # line length is enforced by the formatter, not the linter
]

# Complexity, not line count, is the real proxy for "function is too long".
# A 60-line flat dispatch table is fine; a 30-line quadruple-nested loop is not.
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, magic numbers and long fixture literals.
"tests/**" = ["ANN", "B011"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/groundtruth"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
# These ship without type information or with incomplete stubs.
module = ["sentence_transformers.*", "pgvector.*", "zstandard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# --strict-markers turns a typo'd marker into an error. Without it,
# `-m "not requires_model"` silently matches nothing and the gate runs the
# very thing it was meant to exclude.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "gate: the regression gate. Never skipped, never deselected by default.",
    "integration: needs Postgres. Excluded from the fast path.",
    "requires_model: needs local model weights (the `models` extra).",
    "requires_api: needs ANTHROPIC_API_KEY and network.",
    "slow: minutes, not seconds. Never runs on a Stop hook.",
]

[tool.coverage.run]
source = ["src/groundtruth"]
branch = true
omit = [
    # Network fetch path: exercised manually, not reproducibly testable in the
    # fast lane. Excluded honestly rather than padded with a mock-only test.
    "src/groundtruth/corpus/courtlistener.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
